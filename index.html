<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MILAN STORE</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    header {
      margin-bottom: 30px;
    }
    h1 {
      color: #e5a93c;
      margin-bottom: 10px;
    }
    .search-box {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    .chips {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #ccc;
      cursor: pointer;
      border: 1px solid #444;
    }
    .chip.active {
      background: #e5a93c;
      color: #000;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 5px 0;
      font-size: 16px;
    }
    .card p {
      color: #888;
      font-size: 12px;
      margin: 2px 0 10px 0;
    }
    .btn {
      background: #e5a93c;
      color: #000;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      width: 80%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <h1>بەخێربێن بۆ کۆگای MILAN</h1>
    <p>باشترین ئەپ و یارییەکان دابەزێنە</p>
  </header>

  <input type="text" id="searchInput" class="search-box" placeholder="گەڕان بەدوای ئەپ یان یاری...">

  <div class="chips">
    <div class="chip active" onclick="filterApps('all')"> هەموو</div>
    <div class="chip" onclick="filterApps('app')">ئەپەکان</div>
    <div class="chip" onclick="filterApps('game')">یارییەکان</div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const apps = [
      { name: "VLC", cat: "app", size: "50 MB", icon: "🎬", url: "#" },
      { name: "ویکیپیدیا", cat: "app", size: "30 MB", icon: "🌐", url: "#" },
      { name: "Signal", cat: "app", size: "80 MB", icon: "💬", url: "#" },
      { name: "Firefox", cat: "app", size: "90 MB", icon: "🦊", url: "#" },
      { name: "Subway Surfers", cat: "game", size: "130 MB", icon: "🏃", url: "#" },
      { name: "Among Us", cat: "game", size: "100 MB", icon: "🚀", url: "#" },
      { name: "8 Ball Pool", cat: "game", size: "120 MB", icon: "🎱", url: "#" },
      {
        name: "VideoStar Pro",
        cat: "app",
        size: "170 MB",
        icon: "https://i.ibb.co/kgdmHDY2/milan.png",
        url: "itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/melanmahamad443-bot/Milan_ipa/main/manifest.plist"
      }
    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');

    function renderApps(items) {
      grid.innerHTML = '';
      items.forEach(item => {
        const isUrlIcon = item.icon.startsWith('http');
        const iconHtml = isUrlIcon 
          ? `<img src="${item.icon}" alt="${item.name}">`
          : `<div style="font-size:40px; margin-bottom:10px;">${item.icon}</div>`;

        grid.innerHTML += `
          <div class="card">
            ${iconHtml}
            <h3>${item.name}</h3>
            <p>${item.size}</p>
            <a href="${item.url}" class="btn">دابەزاندن ⬇️</a>
          </div>
        `;
      });
    }

    function filterApps(category) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      if (category === 'all') {
        renderApps(apps);
      } else {
        renderApps(apps.filter(a => a.cat === category));
      }
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      renderApps(apps.filter(a => a.name.toLowerCase().includes(term)));
    });

    renderApps(apps);
  </script>
</body>
</html>
