<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILAN STORE | فڕۆشگای میلان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f5d76e;
    --gold-dark: #9c7c1e;
    --bg: #000000;
    --card: #111111;
    --card-hover: #1a1a1a;
    --border: rgba(212,175,55,.28);
    --text: #f0ead8;
    --muted: #9a917c;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    min-height: 100vh;
  }

  /* ===== سەرەوە / لۆگۆ ===== */
  header {
    text-align: center;
    padding: 28px 16px 18px;
    background: radial-gradient(ellipse at 50% 0%, rgba(212,175,55,.12), transparent 70%);
    border-bottom: 1px solid var(--border);
  }
  header img.logo {
    width: 130px; height: auto;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(212,175,55,.35);
  }
  header h1 {
    margin-top: 12px;
    font-size: 1.5rem; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p.tag { color: var(--muted); font-size: .85rem; margin-top: 4px; }

  /* ===== بەشی بەخێربێین ===== */
  .welcome {
    text-align: center;
    padding: 34px 20px 26px;
  }
  .welcome h2 {
    font-size: 1.9rem; font-weight: 800;
    background: linear-gradient(135deg, #fff, var(--gold-light), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome p { color: var(--muted); margin-top: 10px; font-size: .95rem; max-width: 480px; margin-inline: auto; line-height: 1.9; }
  .divider {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 22px auto 0; max-width: 320px;
  }
  .divider .line { flex:1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider .diamond { color: var(--gold); font-size: .8rem; }

  /* ===== گەڕان و فلتەر ===== */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,.92);
    backdrop-filter: blur(10px);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
  }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: .95rem;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box .icon { color: var(--gold); }
  .chips { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
  .chip {
    padding: 7px 18px; border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card); color: var(--muted);
    font-family: inherit; font-size: .85rem; cursor: pointer;
    transition: all .2s;
  }
  .chip.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #000; font-weight: 700; border-color: var(--gold);
  }

  /* ===== هێڵی جیاوازی بەخێربێین و ئەپەکان ===== */
  .section-title {
    display: flex; align-items: center; gap: 14px;
    padding: 26px 20px 6px;
  }
  .section-title h3 { font-size: 1.1rem; color: var(--gold-light); white-space: nowrap; }
  .section-title .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

  /* ===== کارتی ئەپەکان ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    padding: 16px;
    max-width: 900px; margin-inline: auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    transition: transform .2s, background .2s, box-shadow .2s;
  }
  .card:hover {
    background: var(--card-hover);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(212,175,55,.15);
  }
  .app-icon {
    width: 64px; height: 64px; margin-inline: auto;
    border-radius: 16px;
    background: linear-gradient(135deg, #1d1a10, #2b2513);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    box-shadow: inset 0 0 12px rgba(212,175,55,.1);
  }
  .app-icon img { width: 100%; height: 100%; border-radius: 16px; object-fit: cover; }
  .card h4 { margin-top: 10px; font-size: .95rem; font-weight: 600; }
  .card .meta { color: var(--muted); font-size: .75rem; margin-top: 3px; }
  .badge {
    display: inline-block; margin-top: 6px;
    font-size: .68rem; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--gold-light);
  }
  .badge.game { color: #8ecfff; border-color: rgba(142,207,255,.3); }
  .install-btn {
    display: block; margin-top: 12px;
    padding: 9px 0; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    color: #000; font-weight: 800; font-size: .9rem;
    text-decoration: none; font-family: inherit;
    transition: filter .2s;
  }
  .install-btn:active { filter: brightness(1.2); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; grid-column: 1/-1; }

  /* ===== فوتەر ===== */
  footer {
    text-align: center;
    padding: 28px 16px 40px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: .78rem; line-height: 2;
  }
  footer .gold { color: var(--gold); }
</style>
</head>

  { name: "Video star_404", cat: "videostar", size: "348 مێگا", icon: "🔮", url: "itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/melanmahamad443-bot/Milan_ipa/main/manifest.plist" }
];

   /* ✅ نموونە: چۆن IPAی خۆت زیاد بکەیت (IPAی ساینکراو لە سێرڤەرەکەت)
  { name: "ئەپی خۆم", cat: "app", size: "٣٠ مێگا", icon: "⭐",
    url: "itms-services://?action=download-manifest&url=https://YOUR-SERVER.com/app.plist" },
  */
  
const grid = document.getElementById('grid');
const searchInput = document.getElementById('search') || document.getElementById('searchInput');
const chips = document.querySelectorAll('.chip');
let currentFilter = 'all';

const catName = {
  app: 'ئەپ',
  game: 'یاری',
  videostar: 'ڤیدیۆستار',
  vscodes: 'کۆد'
};

function render() {
  if (!grid) return;
  const q = searchInput ? searchInput.value.trim().toLowerCase() : '';
  const list = apps.filter(a => {
    const matchesFilter = (currentFilter === 'all') || (a.cat === currentFilter);
    const matchesSearch = a.name.toLowerCase().includes(q);
    return matchesFilter && matchesSearch;
  });

  if (list.length > 0) {
    grid.innerHTML = list.map(a => `
      <div class="card">
        <div class="app-icon">${a.icon}</div>
        <h4>${a.name}</h4>
        <div class="meta">${a.size}</div>
        <span class="badge ${a.cat}">${catName[a.cat] || 'ئەپ'}</span>
        <a class="install-btn" href="${a.url}">داگرتن ⬇️</a>
      </div>
    `).join('');
  } else {
    let emptyText = "هیچ ئەپێک نەدۆزرایەوە 🔍";
    if (currentFilter === 'vscodes') {
      emptyText = "هیچ کۆدێک نەدۆزرایەوە 🔍";
    }
    grid.innerHTML = `<div class="empty">${emptyText}</div>`;
  }
}

chips.forEach(c => c.addEventListener('click', () => {
  chips.forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  currentFilter = c.dataset.filter || 'all';
  render();
}));

if (searchInput) {
  searchInput.addEventListener('input', render);
}

render();
</script>

</html>
